[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhneth0-mlopsarch_jd037"
version = "0.1.0"
description = "解析时间标记，排列MLOps 平台架构师·长工具链的上下文回收的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zhneth0" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zhneth0.github.io"
Repository = "https://github.com/zhneth0/mlopsarch_jd037"
Issues = "https://github.com/zhneth0/mlopsarch_jd037/issues"

[project.scripts]
mlopsarch_jd037 = "mlopsarch_jd037:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd037"]
